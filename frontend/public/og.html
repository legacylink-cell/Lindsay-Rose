<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  .wrap {
    width:1200px; height:630px; position:relative;
    background: linear-gradient(135deg, #1E5F4C 0%, #153F33 100%);
    color:#FAF7F1; font-family:'Inter',sans-serif;
    padding:72px 80px; display:flex; flex-direction:column; justify-content:space-between;
  }
  .blob1 { position:absolute; top:-140px; right:-120px; width:520px; height:520px; border-radius:50%; background:rgba(219,161,58,0.18); filter:blur(10px); }
  .blob2 { position:absolute; bottom:-180px; left:-120px; width:460px; height:460px; border-radius:50%; background:rgba(255,255,255,0.06); }
  .brand { display:flex; align-items:center; gap:18px; position:relative; }
  .logo { width:82px; height:82px; border-radius:20px; background:#FAF7F1; display:flex; align-items:center; justify-content:center; }
  .logo svg { width:46px; height:46px; }
  .bname { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:40px; line-height:1; }
  .btag { font-size:15px; letter-spacing:3px; text-transform:uppercase; color:rgba(250,247,241,0.6); margin-top:6px; }
  h1 { font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:76px; line-height:1.02; letter-spacing:-1.5px; max-width:900px; position:relative; }
  h1 .accent { color:#E9BE6E; }
  .sub { font-size:26px; color:rgba(250,247,241,0.82); margin-top:24px; max-width:820px; position:relative; }
  .pills { display:flex; gap:14px; position:relative; }
  .pill { background:rgba(255,255,255,0.10); border:1px solid rgba(255,255,255,0.16); border-radius:999px; padding:14px 26px; font-size:20px; font-weight:600; }
  .pill.amber { background:#DBA13A; color:#20261F; border-color:#DBA13A; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1E5F4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div>
        <div class="bname">Brightleaf</div>
        <div class="btag">Cleaning Co.</div>
      </div>
    </div>

    <div>
      <h1>We brighten your space, <span class="accent">so you get your time back.</span></h1>
      <p class="sub">Trusted home &amp; commercial cleaning across the Dallas&ndash;Fort Worth metroplex.</p>
    </div>

    <div class="pills">
      <div class="pill amber">Free Quote &middot; 469-443-6903</div>
      <div class="pill">Bonded &amp; Insured</div>
      <div class="pill">Eco-Friendly</div>
      <div class="pill">4.9&#9733; Rated</div>
    </div>
  </div>
</body>
</html>
